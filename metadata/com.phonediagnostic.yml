Summary: On-device phone diagnostics without accounts or analytics
Description: |-
    Phone Diagnostic Tool shows CPU, GPU, battery, RAM, storage, display,
    sensors, cameras, and optional network latency — entirely on the device.

    No accounts, no analytics SDKs, and no cloud upload of reports. The only
    network use is an optional TCP latency probe (disabled in Settings).

    Features include live sensor streaming, battery and thermal history,
    a background monitor with a capped rotating log, CPU load test, and
    share/export of diagnostic reports as text or JSON.
