name: Apply v1.3.2 patch and build

on:
  workflow_dispatch:
  push:
    branches: [fix/v1.3.2-cleanup]

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply cleanup patch
        run: |
          if [ -f docs/patches/v1.3.2-cleanup.patch ]; then
            patch -p1 --forward < docs/patches/v1.3.2-cleanup.patch || true
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -A
            git diff --cached --quiet || git commit -m "Apply v1.3.2 cleanup patch"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode CI debug keystore
        run: |
          if [ -f keystore/debug.keystore.b64 ]; then
            base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDiagnostic-debug-1.3.2
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDiagnostic-release-1.3.2
          path: app/build/outputs/apk/release/*.apk
