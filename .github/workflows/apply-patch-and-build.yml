name: Apply v1.3.2 patch and build

on:
  workflow_dispatch:
  push:
    branches: [fix/v1.3.2-cleanup]

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.3.2-cleanup
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply cleanup patch to sources
        run: |
          set -e
          if [ -f docs/patches/v1.3.2-cleanup.patch ]; then
            patch -p1 --forward < docs/patches/v1.3.2-cleanup.patch || {
              echo "Patch may already be applied; continuing"
            }
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/phonediagnostic/ui/DeviceViewModel.kt \
                  app/src/main/java/com/phonediagnostic/data/DeviceInfoCollector.kt \
                  app/src/main/java/com/phonediagnostic/ui/BatteryScreen.kt || true
          if ! git diff --cached --quiet; then
            git commit -m "Apply v1.3.2 cleanup: Mutex collection, sensor sampling, current direction"
            git push origin HEAD:fix/v1.3.2-cleanup
          else
            echo "No source changes to commit (patch already applied)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode CI debug keystore
        run: |
          if [ -f keystore/debug.keystore.b64 ]; then
            base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDiagnostic-debug-1.3.2
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDiagnostic-release-1.3.2
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
