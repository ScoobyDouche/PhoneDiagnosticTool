name: Release

# Cutting a release used to be a manual click-path: download the CI artifact,
# unzip it, create the tag, open the release form, paste the notes, attach the
# APK. This does the whole thing from one button, so the shipped binary is
# always the one CI just built from the tagged commit rather than whatever was
# lying around in someone's Downloads folder.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.1.1). Must match versionName in app/build.gradle.kts."
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as a draft (publish by hand afterwards)"
        required: false
        default: false
        type: boolean
      allow_public_key_signing:
        description: "Publish without a release key, signing with the CI key whose private half is public. The release is labelled as such."
        required: false
        default: false
        type: boolean
  # Pushing a v* tag from a workstation releases too, so the button is a
  # convenience rather than the only route.
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Everything downstream keys off VERSION, so resolve it once and refuse to
      # continue if it disagrees with what the app will actually report about
      # itself. A release tagged 1.1.1 that installs as 1.1.0 is worse than no
      # release at all.
      - name: Resolve and verify version
        id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a MAJOR.MINOR.PATCH version"
            exit 1
          fi

          GRADLE_VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          if [ "$VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Requested $VERSION but app/build.gradle.kts declares versionName $GRADLE_VERSION. Bump the build file first."
            exit 1
          fi

          if [ "${{ github.event_name }}" != "push" ] \
            && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump the version or delete the tag."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from ${GITHUB_SHA:0:7}"

      # Prefer hand-written notes; fall back to the matching CHANGELOG section;
      # fall back again to GitHub's generated notes. A release always ships with
      # some description of what changed.
      - name: Assemble release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          HANDWRITTEN="docs/release-notes/v$VERSION.md"
          BODY="$RUNNER_TEMP/release-body.md"

          if [ -f "$HANDWRITTEN" ]; then
            cp "$HANDWRITTEN" "$BODY"
            echo "Using $HANDWRITTEN"
          else
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
              flag && /^## \[/ { exit }
              flag { print }
            ' CHANGELOG.md > "$BODY"
            echo "Extracted the $VERSION section from CHANGELOG.md"
          fi

          # A leading "# Title" line becomes the release title rather than being
          # repeated as the first line of its own body.
          TITLE="$(sed -n '1s/^# \([^#].*\)$/\1/p' "$BODY")"
          if [ -n "$TITLE" ]; then
            sed -i '1d' "$BODY"
          else
            TITLE="v$VERSION"
          fi

          if [ ! -s "$BODY" ]; then
            echo "No notes found for $VERSION — falling back to generated notes"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
          fi

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "body_file=$BODY" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore fixed debug keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore

      - name: Restore release keystore (if secrets present)
        id: release_sign
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] \
            && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "store_file=$GITHUB_WORKSPACE/keystore/release.keystore" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Falling back to the committed CI keystore, whose private key is public,
      # must never be something that just happens — a missing or mistyped secret
      # has to stop the release rather than quietly downgrade it. So the fallback
      # is still refused by default, and is reachable only by ticking
      # allow_public_key_signing on a dispatch, which a human does knowingly and
      # per run. Tag pushes carry no such signal and so can never take it.
      #
      # When it is taken, the release says so on its own page: the original
      # concern was a public-key build going out looking exactly like a normal
      # release, and that stays fixed whichever branch is taken here.
      - name: Resolve signing key
        id: keycheck
        env:
          OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_public_key_signing }}
        run: |
          set -euo pipefail

          if [ "${{ steps.release_sign.outputs.enabled }}" = "true" ]; then
            echo "public_key=false" >> "$GITHUB_OUTPUT"
            echo "Signing with the configured release key."
            exit 0
          fi

          if [ "$OVERRIDE" != "true" ]; then
            echo "::error::Release signing is not configured, so this release would"
            echo "::error::be signed with the CI debug key whose private half is"
            echo "::error::committed to this public repository."
            echo "::error::"
            echo "::error::Set all four repository secrets, then re-run:"
            echo "::error::  RELEASE_KEYSTORE_BASE64  RELEASE_STORE_PASSWORD"
            echo "::error::  RELEASE_KEY_ALIAS        RELEASE_KEY_PASSWORD"
            echo "::error::"
            echo "::error::Steps: docs/DISTRIBUTION.md -> Create a release keystore"
            echo "::error::"
            echo "::error::To publish under the public key anyway, re-run this"
            echo "::error::workflow with 'allow_public_key_signing' ticked."
            exit 1
          fi

          echo "public_key=true" >> "$GITHUB_OUTPUT"
          echo "::warning::Publishing signed with the CI key whose private half is public."

          # Prepended, not appended: someone deciding whether to install reads the
          # top of the page, and this is the part that changes that decision.
          BODY="${{ steps.notes.outputs.body_file }}"
          WARN="$RUNNER_TEMP/key-warning.md"
          {
            echo "> ## ⚠️ Signed with a publicly known key"
            echo ">"
            echo "> The private half of this APK's signing key is committed to this public"
            echo "> repository. Anyone can build an APK that Android will accept as an update"
            echo "> over this one, inheriting its data and permissions — so the signature"
            echo "> proves nothing about where the file came from. Install it only from this"
            echo "> page."
            echo ">"
            echo "> Moving to a private key is still planned. That switch will require"
            echo "> uninstalling first, because Android does not accept a new certificate as"
            echo "> an update to an existing install."
            echo ""
          } > "$WARN"
          cat "$WARN" "$BODY" > "$BODY.new" && mv "$BODY.new" "$BODY"

      - name: Grant execute (if wrapper present)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Pick Gradle command
        id: gradle
        run: |
          if [ -f gradlew ]; then
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi

      # The tests gate the release, not just the branch build: a red suite must
      # never reach a tagged artifact.
      - name: Unit tests
        run: ${{ steps.gradle.outputs.cmd }} test --no-daemon --stacktrace

      - name: Build debug APK
        run: ${{ steps.gradle.outputs.cmd }} assembleDebug --no-daemon --stacktrace

      - name: Build release APK and AAB
        env:
          RELEASE_STORE_FILE: ${{ steps.release_sign.outputs.store_file }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ${{ steps.gradle.outputs.cmd }} assembleRelease bundleRelease --no-daemon --stacktrace

      # Ship the RELEASE variant, not the debug one. The debug build carries
      # android:debuggable, the Compose tooling libraries and no minification —
      # 16.9 MB against 1.2 MB, and a debugger-attachable app in users' hands.
      # See docs/SECURITY-AUDIT.md.
      #
      # It is signed with the same key either way, so existing installs upgrade
      # in place rather than needing an uninstall.
      #
      # No checksum file: it would sit on the same release page, served over the
      # same connection, as the APK it vouches for, so it proves nothing an
      # attacker could not also forge. Android verifies the APK signature at
      # install time, which is the guarantee that actually holds.
      - name: Stage release assets
        id: assets
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          STAGE="$RUNNER_TEMP/assets"
          mkdir -p "$STAGE"

          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK missing. An unsigned build emits app-release-unsigned.apk;"
            echo "::error::check the signing config rather than publishing the debug variant."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$APK" "$STAGE/PhoneDiagnostic-v$VERSION.apk"

          # The bundle is only useful to a store, and only when it carries a real
          # upload key, so it rides along only then.
          if [ "${{ steps.release_sign.outputs.enabled }}" = "true" ]; then
            cp app/build/outputs/bundle/release/app-release.aab \
               "$STAGE/PhoneDiagnostic-v$VERSION.aab"
          fi

          ls -la "$STAGE"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"

      # keytool cannot read a v2/v3-only signature, which is what modern builds
      # produce, so this uses apksigner from build-tools.
      - name: Report signing certificate
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found; skipping fingerprint report"
            exit 0
          fi
          echo "Signing certificate of the artifact being published:"
          "$APKSIGNER" verify --print-certs \
            "${{ steps.assets.outputs.dir }}/PhoneDiagnostic-v${{ steps.v.outputs.version }}.apk" \
            | grep -Ei "SHA-256|Subject" || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"

          ARGS=(
            "$TAG"
            --title "${{ steps.notes.outputs.title }}"
            --target "$GITHUB_SHA"
          )
          # Checked against the file rather than the notes step's verdict: the
          # signing step may have written a warning into a body that was empty
          # when that verdict was recorded, and that warning must not be lost.
          BODY="${{ steps.notes.outputs.body_file }}"
          if [ -s "$BODY" ]; then
            ARGS+=(--notes-file "$BODY")
          else
            ARGS+=(--generate-notes)
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            if [ "${{ inputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
            if [ "${{ inputs.draft }}" = "true" ]; then ARGS+=(--draft); fi
          fi

          gh release create "${ARGS[@]}" "${{ steps.assets.outputs.dir }}"/*

          echo "### Released [$TAG]($(gh release view "$TAG" --json url -q .url))" >> "$GITHUB_STEP_SUMMARY"
