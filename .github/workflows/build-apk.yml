name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every push to a PR branch now builds, so without this a burst of pushes leaves
# superseded runs queued behind the only one whose result anybody wants. Runs on
# main are never cancelled — those are the ones that produce the shipped APK.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore fixed debug keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore
          ls -la keystore/debug.keystore

      - name: Grant execute (if wrapper present)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Pick Gradle command
        id: gradle
        run: |
          if [ -f gradlew ]; then
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ${{ steps.gradle.outputs.cmd }} test --no-daemon --stacktrace

      - name: Build debug APK
        run: ${{ steps.gradle.outputs.cmd }} assembleDebug --no-daemon --stacktrace

      # The release variant runs R8 and resource shrinking, which the debug
      # variant does not. Without this it was never compiled, so a broken keep
      # rule would only surface when someone tried to cut a release.
      - name: Build release APK (verifies R8 / shrinker config)
        run: ${{ steps.gradle.outputs.cmd }} assembleRelease --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDiagnostic-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
