name: Cleanup release asset

# One-off. v1.1.2 shipped with a SHA256SUMS.txt that is no longer wanted, and
# release assets can only be removed with a token that has contents: write.
# Delete this workflow file once it has run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.1.2"
        required: true
        type: string
      asset:
        description: "Exact asset filename to delete"
        required: true
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          ASSET="${{ inputs.asset }}"

          echo "Assets on $TAG before:"
          gh release view "$TAG" --json assets -q '.assets[].name'

          # Refuse to touch an APK. This job exists to remove a stray text file;
          # deleting the binary people install would be unrecoverable from here.
          case "$ASSET" in
            *.apk|*.aab) echo "::error::Refusing to delete a build artifact ($ASSET)"; exit 1 ;;
          esac

          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -Fxq "$ASSET"; then
            echo "$ASSET is not attached to $TAG — nothing to do"
            exit 0
          fi

          gh release delete-asset "$TAG" "$ASSET" --yes

          echo "Assets on $TAG after:"
          gh release view "$TAG" --json assets -q '.assets[].name'
